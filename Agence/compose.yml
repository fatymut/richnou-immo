services:
  mongo:
    image: mongo:7
    ports:
    - "27018:27017"
    volumes:
    - mongo_data:/data/db
      

  agence:
    build: .
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: richnou_agence
      GRPC_RESEAU_ADDR: host.docker.internal:50051
    depends_on:
      - mongo

volumes:
  mongo_data: